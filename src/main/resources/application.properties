spring.application.name=sgelasmart
# Drop and recreate the schema on restart to prevent duplicate data from data.sql
spring.jpa.hibernate.ddl-auto=create-drop

# Ensure the data.sql script is always executed on startup
spring.sql.init.mode=always

# Defer script execution until Hibernate has finished creating the tables
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
