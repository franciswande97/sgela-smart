spring.application.name=sgelasmart
# Drop and recreate the schema on restart to prevent duplicate data from data.sql
spring.jpa.hibernate.ddl-auto=create-drop

# Ensure the data.sql script is always executed on startup
spring.sql.init.mode=always

# Defer script execution until Hibernate has finished creating the tables
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
gemini.api.key=AIzaSyBLPXztuzwp4zKs_cD25EkAn2D-tMNBlr8
# 1. Disable the startup ASCII banner
spring.main.banner-mode=off

# 2. Lean, colorized, FastAPI/Uvicorn-style console pattern
# Outputs: [HH:mm:ss] LEVEL logger_name: message
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-25.25logger{20}){cyan} : %msg%n

# 3. Suppress verbose startup chatter from framework internals
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate.orm=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.coyote.http11=WARN

# 4. Keep your app code visible
logging.level.com.app.sgelasmart=INFO
